services:
  playwright-tests:
    build:
      context: .
      dockerfile: Dockerfile
    image: playwright-opencart
    working_dir: /app
    environment:
      CI: "1"
      APP_ENV: ${APP_ENV:?Set APP_ENV}
      WEB_APP_URL: ${WEB_APP_URL:?Set WEB_APP_URL}
      API_BASE_URL: ${API_BASE_URL:?Set API_BASE_URL}
      ADMIN_APP_URL: ${ADMIN_APP_URL:-}
      APP_EMAIL: ${APP_EMAIL:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      API_USERNAME: ${API_USERNAME:-}
      API_PASSWORD: ${API_PASSWORD:-}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-}
    volumes:
      - /app/node_modules
      - ./reports:/app/reports
      - ./allure-results:/app/allure-results
      - ./allure-report:/app/allure-report
      - ./custom-report:/app/custom-report
      - ./test-results:/app/test-results
    command: ["all"]